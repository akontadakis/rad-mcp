[project]
name = "rad-mcp"
version = "0.1.0"
description = "Radiance lighting simulation as a local MCP server: annual daylight (2/3/5-phase, BSDF), LM-83 sDA/ASE, EN 17037, renders, DGP and UGR glare, IES luminaires"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Antonios Kontadakis" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "radiance",
  "daylighting",
  "lighting-simulation",
  "bsdf",
  "three-phase",
  "five-phase",
  "lm-83",
  "en-17037",
  "en-12464",
  "glare",
  "building-simulation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["mcp[cli]>=2.0,<2.1", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/akontadakis/rad-mcp"
Repository = "https://github.com/akontadakis/rad-mcp"
Issues = "https://github.com/akontadakis/rad-mcp/issues"

[project.scripts]
rad-mcp = "rad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rad_core", "src/rad_engine", "src/rad_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "LICENSE", "LICENSES", "README.md", "pyproject.toml"]
